# Reorder defaults for products the camera recognises (config/camera_foods.yaml).
# The camera encounter list drives which products appear on the shelf; this file
# only supplies quantity / unit / lead time when a food does not override them.
#
# reorder_quantity  how much to order when the shelf runs low
# unit              l (litres), kg (kilos) or pcs (sales units as Valio sells them)
# usual_quantity    the normal order size, used by the "unusually large" rule
# lead_time_days    the order is needed this many days after the shelf runs low

defaults:
  reorder_quantity: 24
  unit: pcs
  usual_quantity: 24
  lead_time_days: 2
  constraints: []
  preferences: []
  search_terms: ""
